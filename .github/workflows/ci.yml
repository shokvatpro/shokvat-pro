name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, unit tests, gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install (frozen when a lockfile is committed)
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Upload generated lockfile (bootstrap only)
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with: { name: pnpm-lock, path: pnpm-lock.yaml, retention-days: 7 }
      - run: pnpm tokens
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test --filter=!@shokfat/db-tenant --filter=!@shokfat/db-control
      - run: pnpm gallery
      - uses: actions/upload-artifact@v4
        with: { name: ui-gallery, path: packages/ui/gallery/out, retention-days: 14 }

  database-isolation:
    name: Database isolation (PostgreSQL 16)
    # Real PostgreSQL: RLS / tenant-isolation tests must pass before merge.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      # Test files run one at a time: they share the single service database server.
      - run: pnpm --workspace-concurrency=1 --filter @shokfat/db-tenant --filter @shokfat/db-control exec tsx --test --test-concurrency=1 test/*.test.ts

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*_linux_x64.tar.gz' --output gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --redact --verbose

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - run: pnpm audit --audit-level high
